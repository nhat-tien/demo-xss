{% extends 'core/base.html' %}
{% load static %}

{% block title %}My Profile - MusicMart{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-md-12">
                <div class="row g-4">
                    <!-- Profile Card -->
                    <div class="col-lg-4">
                        <div class="auth-card h-100">
                            <div class="auth-image text-center">
                                <i class="fas fa-user-circle fa-6x"></i>
                            </div>
                            <div class="p-4 text-center">
                                <h2 class="section-title mb-3">{{ user.first_name }} {{ user.last_name }}</h2>
                                <p class="text-muted mb-4">{{ user.email }}</p>
                                <div class="d-grid gap-2">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Edit Form Card -->
                    <div class="col-lg-8">
                        <div class="auth-card h-100">
                            <div class="p-5">
                                <h2 class="section-title mb-4">Profile Details</h2>
                                
                                <form method="post">
                                    {% csrf_token %}
                                    <div class="row">
                                        <div class="col-md-6 mb-4">
                                            <label class="form-label fw-semibold text-dark">First Name</label>
                                            <input type="text" name="first_name" class="form-control" 
                                                   value="{{ user.first_name }}">
                                        </div>
                                        <div class="col-md-6 mb-4">
                                            <label class="form-label fw-semibold text-dark">Last Name</label>
                                            <input type="text" name="last_name" class="form-control" 
                                                   value="{{ user.last_name }}">
                                        </div>
                                    </div>
                                    
                                    <div class="mb-4">
                                        <label class="form-label fw-semibold text-dark">Email Address</label>
                                        <input type="email" class="form-control" value="{{ user.email }}" readonly>
                                    </div>

                                    <h5 class="fw-bold text-dark mb-3 mt-4">Shipping Information</h5>
                                    
                                    <div class="mb-4">
                                        <label class="form-label fw-semibold text-dark">Phone Number</label>
                                        <input type="tel" name="phone" class="form-control" 
                                               value="{{ customer.phone_number }}" placeholder="Optional">
                                    </div>

                                    <div class="mb-5">
                                        <label class="form-label fw-semibold text-dark">Address</label>
                                        <textarea name="address" class="form-control" rows="3" 
                                                  placeholder="Enter your full address">{{ customer.address }}</textarea>
                                    </div>

                                    <button type="submit" class="btn btn-gold btn-lg w-100 mb-3">
                                        <i class="fas fa-save me-2"></i>Update Profile
                                    </button>
                                </form>

                                <div class="text-center">
                                    <a href="{% url 'logout' %}" class="auth-link fw-semibold">
                                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.auth-container { 
    min-height: calc(100vh - 76px); 
    display: flex; 
    align-items: center; 
    background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 100%); 
}
.auth-card { 
    background: rgba(255, 255, 255, 0.95); 
    backdrop-filter: blur(20px); 
    border: 1px solid rgba(212, 175, 55, 0.2); 
    border-radius: 20px; 
    box-shadow: 0 25px 50px rgba(0,0,0,0.3); 
    overflow: hidden; 
}
.auth-image { 
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%); 
    height: 250px; 
    position: relative; 
    overflow: hidden; 
}
.auth-image i { 
    font-size: 6rem; 
    color: rgba(255,255,255,0.9); 
    position: absolute; 
    top: 50%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
}
.form-control { 
    border: 2px solid #e9ecef; 
    border-radius: 15px; 
    padding: 15px 20px; 
    transition: all 0.3s ease; 
    background: rgba(255,255,255,0.9); 
}
.form-control:focus { 
    border-color: var(--gold); 
    box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.25); 
}
.form-control[readonly] { 
    background-color: #f8f9fa; 
}
.btn-gold { 
    border-radius: 15px; 
}
textarea.form-control { 
    resize: vertical; 
}
@media (max-width: 991px) { 
    .auth-image { height: 200px; } 
    .auth-image i { font-size: 4rem; } 
}
</style>
{% endblock %}
